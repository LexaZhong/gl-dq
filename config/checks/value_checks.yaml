enabled: true
order: 27
# Columns compared across BOP / BMQ / CMQ: a value used by only one source is usually a mapping
# difference rather than a real one.
categorical:
  covg_type_desc: {}
  expn_bs: {}
  mm_seg_cd: {}
  each_occ_lmt_amt: {}
  genl_ag_lmt_amt: {}
  tx_type_nm: {}
  pol_stat: {}
  trr_cd: {max_values: 4000}
# Plausible range and sign per column. Bounds are reviewed like code, so they live here.
numeric:
  tot_wrtn_prm_amt: {min: -500000, max: 10000000}
  # exposure grain differs by source (CMQ is policy level, BOP/BMQ per location), so the
  # cross-source median comparison would flag real structure
  expo_amt: {min: 0, max: 100000000, allow_negative: false, compare_medians: false}
  allocation: {min: 0, max: 50000000, allow_negative: false}
  claim_alloc: {min: 0, max: 500, allow_negative: false}
  each_occ_lmt_amt: {min: 25000, max: 5000000, discrete: true, top_value_warn: 0.8}
  genl_ag_lmt_amt: {min: 25000, max: 10000000, discrete: true, top_value_warn: 0.8}
  bi_ded_amt: {min: 0, max: 25000, discrete: true, top_value_warn: 0.8}
  pd_ded_amt: {min: 0, max: 25000, discrete: true, top_value_warn: 0.8}
  csl_ded_amt: {min: 0, max: 25000, discrete: true, top_value_warn: 0.8}
median_ratio: {warn: 10, fail: 50}
