enabled: true
order: 25
group_by: [src]
rules:
  - id: exp_after_eff
    description: Policy expiration date must be on or after the effective date
    variables: [pol_exp_dt, pol_eff_dt]
    violation: "pol_exp_dt < pol_eff_dt"
    warn: 0.0
    fail: 0.0005
  - id: ded_bi_pd_xor_csl
    description: Split BI/PD deductibles and CSL deductible are mutually exclusive
    variables: [csl_ded_amt, bi_ded_amt, pd_ded_amt]
    violation: "csl_ded_amt IS NOT NULL AND (bi_ded_amt IS NOT NULL OR pd_ded_amt IS NOT NULL)"
  - id: cancellation_non_positive_premium
    description: Cancellation transactions should not carry positive premium
    variables: [tx_type_nm, tot_wrtn_prm_amt]
    applies_when: "tx_type_nm = 'Cancellation'"
    violation: "tot_wrtn_prm_amt > 0"
  - id: loss_without_claim
    description: Allocated loss should come with a claim count
    variables: [allocation, claim_cnt]
    applies_when: "allocation > 0"
    violation: "COALESCE(claim_cnt, 0) = 0"
