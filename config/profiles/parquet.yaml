# Read parquet files directly - no SQL warehouse, no Spark, no Delta table.
# Useful for an extract on a volume, or for working from a laptop with a sample.
#
#   DQ_PARQUET_TABLE=/Volumes/.../gl_master/*.parquet python jobs/check_setup.py --profile parquet
#   DQ_PROFILE=parquet streamlit run app/app.py
#
# Column names, measures, check thresholds and the source-of-truth queries are inherited from prod,
# so an extract is checked exactly like the table. Each view below may be a file, a folder or a glob.
extends: prod

name: GL master (parquet)
backend: parquet

parquet_views:
  gl_master: ${DQ_PARQUET_TABLE:-data/extract/gl_master}
  sot_premium: ${DQ_PARQUET_SOT_PREMIUM:-data/extract/sot_premium}   # optional: skipped if absent
  sot_loss: ${DQ_PARQUET_SOT_LOSS:-data/extract/sot_loss}            # optional: skipped if absent

table: gl_master
sql_vars:
  sot_premium_table: sot_premium
  sot_loss_table: sot_loss
  study_from: ${DQ_STUDY_FROM:-2014-01-01}
  study_to: ${DQ_STUDY_TO:-2025-12-31}

config_dir: ${DQ_CONFIG_DIR:-config}
knowledge_dir: ${DQ_KNOWLEDGE_DIR:-data/knowledge_parquet}
results:
  type: parquet
  path: ${DQ_RESULTS_PATH:-data/results_parquet}
