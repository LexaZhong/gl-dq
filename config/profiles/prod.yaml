# Databricks profile: gl_master on a SQL warehouse, config + knowledge in a UC Volume, results in Delta.
# Env vars are set by the Databricks App (databricks.yml -> apps.config.env) and by the refresh job.
# To dry-run against the synthetic tables on Databricks: DQ_TABLE=<cat>.<schema>.gl_master_synth
name: GL master
# Defaults: table in na_actuarial_explore.consd_sb_actuarial_sandbox, everything the dashboard
# writes under the risk-cohort volume. Override with DQ_CATALOG / DQ_SCHEMA / DQ_VOLUME_DIR.
backend: databricks
warehouse_id: ${DATABRICKS_WAREHOUSE_ID}
table: ${DQ_TABLE:-${DQ_CATALOG:-na_actuarial_explore}.${DQ_SCHEMA:-consd_sb_actuarial_sandbox}.gl_master}
src_col: src
sources: [BOP, BMQ, CMQ]

derived_columns:
  pol_yr: {expr: "year(pol_eff_dt)", type: int}
  loss_yr: {expr: "year(evt_dt)", type: int}

measures:
  written_premium: tot_wrtn_prm_amt
  loss: allocation
  claim_count: claim_alloc
  exposure: expo_amt
  exposure_base: expn_bs

policy_key: [pol_num, pol_eff_dt, pol_exp_dt]   # what identifies one policy term (used for policy counts)
segment_candidates: [src, pol_yr, loss_yr, covg_type_desc, expn_bs, mm_seg_cd, loc_st_abbr, trr_cd,
                     class1_cd, each_occ_lmt_amt, genl_ag_lmt_amt, tx_type_nm, pol_stat]

sql_vars:                          # referenced by the SOT queries in <config_dir>/sql/*.sql
  sot_premium_table: ${DQ_SOT_PREMIUM_TABLE:-cimm_csm.premium_transx_seg_enriched_2026q2}
  sot_loss_table: ${DQ_SOT_LOSS_TABLE:-cimm_csm.loss_transx_seg_enriched_2026q2}
  study_from: ${DQ_STUDY_FROM:-2014-01-01}    # policy effective-date window of the study
  study_to: ${DQ_STUDY_TO:-2025-12-31}
  # reference lists used by config/filters.yaml. A CSV on a volume is read in place; point this at a
  # table name instead once the list is loaded (faster, and it can be refreshed on a schedule).
  pco_ids_source: >-
    ${DQ_PCO_IDS_TABLE:-read_files('${DQ_VOLUME_DIR:-/Volumes/na_combined_explore_rfnd-risk_cohort/risk-cohort-volume/GL/gl_master_cleaning}/reference/pco_ids.csv',
    format => 'csv', header => true)}

# config + knowledge live in the UC Volume; override with DQ_CONFIG_DIR=config to dry-run from a laptop
config_dir: ${DQ_CONFIG_DIR:-${DQ_VOLUME_DIR:-/Volumes/na_combined_explore_rfnd-risk_cohort/risk-cohort-volume/GL/gl_master_cleaning}/config}
knowledge_dir: ${DQ_KNOWLEDGE_DIR:-${DQ_VOLUME_DIR:-/Volumes/na_combined_explore_rfnd-risk_cohort/risk-cohort-volume/GL/gl_master_cleaning}/knowledge}
# Everything the dashboard writes (statuses, notes, run history) lives in one volume folder, so it
# survives clusters and app restarts and can sit in a different catalog from gl_master.
results:
  type: parquet                     # one parquet file per run under <volume>/runs
  path: ${DQ_RESULTS_PATH:-${DQ_VOLUME_DIR:-/Volumes/na_combined_explore_rfnd-risk_cohort/risk-cohort-volume/GL/gl_master_cleaning}}
refresh_job_id: ${DQ_REFRESH_JOB_ID}

# The pricing study covers BMQ and CMQ only, has no coverage split, and is limited to policies
# effective 2014-2025, so the pipeline side is filtered to match and the two sides compare like
# for like. When a BOP source of truth exists: UNION it into the SQL and drop 'BOP' from the
# `where` filters below (and widen `dims` again if the BOP study has a coverage split).
check_overrides:
  premium_recon:
    sot_query: sql/sot_premium_prod.sql
    dims: [src, pol_yr]
    where: "src IN ('BMQ', 'CMQ') AND pol_eff_dt >= DATE '2014-01-01' AND pol_eff_dt <= DATE '2025-12-31'"
  loss_recon:
    sot_query: sql/sot_loss_prod.sql
    segments: [src]
    where: "src IN ('BMQ', 'CMQ') AND pol_eff_dt >= DATE '2014-01-01' AND pol_eff_dt <= DATE '2025-12-31'"
    # distinct occurrences (study) vs allocated claim counts (pipeline): widen until confirmed equal
    tolerance_claims: {abs: 25, pct: 0.05}
