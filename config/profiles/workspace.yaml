# Run inside a Databricks notebook or job: uses the cluster's Spark session, no SQL warehouse.
# Everything else (table, measures, source-of-truth queries, check overrides, results table) is
# inherited from the prod profile, so there is only one place to maintain them.
extends: prod

name: GL master (workspace)
backend: spark

# config comes from the cloned repo in the workspace; the knowledge volume path is inherited from
# prod (override it with DQ_KNOWLEDGE_DIR or the notebook widget).
config_dir: ${DQ_CONFIG_DIR:-config}
