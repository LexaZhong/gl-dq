# Global data filters: applied to EVERY query the dashboard and the refresh job run.
#
# Edit them here, or on the Portfolio summary page (🔎 Global filters), which also shows how much
# data each one removes and can save back to this file.
#
# A rule keeps the rows its predicate is TRUE for - a null value is excluded unless the rule says
# otherwise. Everything ships disabled: turning one on is a deliberate act, because it changes
# every number on every page.
#
#   key         stable id; it is stored with each refresh run so findings can be traced back
#   label       what it is called in the UI
#   description why it exists - this is the part your colleagues actually need
#   enabled     false = defined but not applied
#   profiles    empty = every profile, or e.g. [prod] to scope it
#   column/op/values   structured rule (safe by construction; op: in, not_in, is_null, not_null,
#                      eq, ne, gt, gte, lt, lte; use "<null>" as a value to mean NULL)
#   expr        raw SQL predicate for rules no picker can express; {{ raw_table }} is the
#               unfiltered table, which a self-referencing rule must use
filters:
  - key: exclude_zero_exposure
    label: Exclude zero exposure
    description: >
      Rows with no exposure cannot be rated, and they distort every per-exposure metric
      (frequency, premium per exposure unit).
    enabled: false
    column: expo_amt
    op: gt
    values: ["0"]

  - key: us_states_only
    label: US states only
    description: Territories and rows with no state are priced separately and are out of scope here.
    enabled: false
    column: loc_st_abbr
    op: not_in
    values: ["PR", "VI", "GU", "AS", "MP", "<null>"]

  - key: exclude_cancellations
    label: Exclude cancellation transactions
    description: Keep written premium as booked at inception; cancellations are handled downstream.
    enabled: false
    column: tx_type_nm
    op: ne
    values: ["Cancellation"]

  # Rules the pickers cannot express: they ask a question about another dataset, not about the row.
  #
  # Write these as `exclude_when` - the rows to DROP - not as `expr`, which says what to KEEP.
  # SQL three-valued logic is the reason: `NULL IN (...)` is NULL, and an unknown predicate
  # excludes, so a "keep" rule silently drops every row it cannot evaluate (a PCO row with no
  # gl_bop_id, a row whose coverage is null). `exclude_when` drops only what is definitely true.
  #
  # {{ no_pco_ids_source }} is a profile sql_var (config/profiles/*.yaml), so the same rule works
  # everywhere the list is spelled differently:
  #   parquet / duckdb   read_csv_auto('data/reference/gl_bop_id_not_rating_pco.csv')   - read in place
  #   prod / workspace   read_files('/Volumes/.../reference/gl_bop_id_not_rating_pco.csv',
  #                                 format => 'csv', header => true)
  #                      or a table name once the CSV is loaded: my_catalog.my_schema.gl_bop_id_not_rating_pco
  # The CSV lists the ids that do NOT rate products/completed-ops, needs a header row and a
  # gl_bop_id column; anything else in it is ignored. Both sides are cast to string, so a CSV
  # (always text) matches a numeric id column. Note a blank line in a CSV comes back as NULL, not
  # as an empty string, so a genuinely blank id cannot be listed this way.
  - key: pco_rows_for_ids_not_rating_pco
    label: Drop ProductsCompletedOps rows for ids that do not rate PCO
    description: >
      A gl_bop_id on the "not rating PCO" list should not carry a ProductsCompletedOps coverage
      row - those are mapping artefacts, not exposure. The list is maintained outside the pipeline.
    enabled: false
    profiles: [prod, workspace, parquet]
    exclude_when: |
      covg_type_desc = 'ProductsCompletedOps'
      AND CAST(gl_bop_id AS STRING) IN (SELECT CAST(gl_bop_id AS STRING)
                                        FROM {{ no_pco_ids_source }}
                                        WHERE gl_bop_id IS NOT NULL)

  # The same question answered from the data itself, when there is no reference list to maintain:
  # an id writes PCO business if it has PCO premium anywhere in the table. {{ raw_table }} is the
  # UNFILTERED table - a rule that queries the table must use it, or it defines itself.
  - key: pco_without_pco_premium
    label: Drop ProductsCompletedOps rows for ids with no PCO premium in the data
    description: Same intent as pco_rows_for_ids_not_rating_pco, derived from the table instead of a list.
    enabled: false
    profiles: [prod, workspace, parquet]
    exclude_when: |
      covg_type_desc = 'ProductsCompletedOps'
      AND gl_bop_id IS NOT NULL
      AND gl_bop_id NOT IN (SELECT gl_bop_id
                            FROM {{ raw_table }}
                            WHERE covg_type_desc = 'ProductsCompletedOps'
                              AND COALESCE(tot_wrtn_prm_amt, 0) > 0
                              AND gl_bop_id IS NOT NULL)
