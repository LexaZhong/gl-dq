[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gl-dq"
version = "0.1.0"
description = "Config-driven data cleaning tracker for insurance pricing master tables (gl_master)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "plotly>=5.18",
  "streamlit>=1.40",
  "pyarrow>=14",
]

[project.optional-dependencies]
local = ["duckdb>=1.0"]
databricks = ["databricks-sql-connector>=3.0", "databricks-sdk>=0.30"]
dev = ["pytest>=8", "duckdb>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gl_dq = ["sql/*.sql.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
